<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Share</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <h1>📁 File Share</h1>
    <p class="subtitle">Upload files and share with auto-expiring links</p>

    <div class="drop-zone" id="dropZone">
      <div class="drop-zone-icon">☁️</div>
      <div class="drop-zone-text">Drop a file here or click to browse</div>
      <input type="file" id="fileInput" hidden>
    </div>

    <div class="options">
      <div>
        <label>Expires in</label>
        <select id="ttl">
          <option value="1h">1 hour</option>
          <option value="24h" selected>24 hours</option>
          <option value="7d">7 days</option>
          <option value="30d">30 days</option>
        </select>
      </div>
      <div>
        <label>Max downloads</label>
        <select id="maxDownloads">
          <option value="">Unlimited</option>
          <option value="1">1</option>
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="100">100</option>
        </select>
      </div>
      <div>
        <label>Password (optional)</label>
        <input type="password" id="password" placeholder="Leave empty for none">
      </div>
    </div>

    <div class="progress-container" id="progress">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">Uploading...</div>
    </div>

    <div class="result" id="result">
      <div>🔗 Share link:</div>
      <a id="shareLink" href="#" target="_blank"></a>
      <div class="expires" id="expiresAt"></div>
      <div class="qr-container" id="qrContainer"></div>
      <br>
      <button class="copy-btn" onclick="navigator.clipboard.writeText(document.getElementById('shareLink').href)">Copy Link</button>
    </div>
  </div>
  <script src="/js/upload.js"></script>
</body>
</html>
