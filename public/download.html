<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download File</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <h1>📁 File Share</h1>
    <div class="file-card" id="fileCard">
      <div class="file-icon" id="fileIcon">📄</div>
      <div class="file-name" id="fileName">Loading...</div>
      <div class="file-meta" id="fileMeta"></div>
      <div class="preview-container" id="previewContainer"></div>
      <div class="password-input" id="passwordSection">
        <input type="password" id="dlPassword" placeholder="Enter password">
      </div>
      <button class="download-btn" id="downloadBtn">Download</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>
  <script src="/js/download.js"></script>
</body>
</html>
